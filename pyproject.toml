[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cachedoctor"
dynamic = ["version"]
description = "Diagnose LLM prompt caching, forecast what each setting would cost, and plan the fix."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Shamik Saha" }]
keywords = ["llm", "prompt caching", "anthropic", "claude", "cost", "cache", "linter"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/shamiksaharcciit-oss/cachedoctor"
Issues = "https://github.com/shamiksaharcciit-oss/cachedoctor/issues"

[project.scripts]
cachedoctor = "cachedoctor.cli:main"

[tool.hatch.version]
path = "src/cachedoctor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cachedoctor"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
