<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img" aria-label="Three prompt layouts and how much of each request a cache can reuse">
<title>Three prompt layouts and how much of each request a cache can reuse</title>
<style>
  .bg { fill: #fcfcfb; stroke: #e3e2dd; }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #0b0b0b; }
  .sec { fill: #52514e; }
  .grid { stroke: #e3e2dd; }
  .ref { stroke: #8a8983; }
  .s1 { fill: #2a78d6; }
  .s2 { fill: #eb6834; }
  .muted { fill: #d9d8d2; }
  .box { fill: #ffffff; stroke: #c9c8c1; }
  .line { stroke: #6f6e69; fill: none; }
  .head { fill: #6f6e69; }
  .oninv { fill: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; stroke: #3a3a37; }
    text { fill: #f0efec; }
    .sec { fill: #c3c2b7; }
    .grid { stroke: #3a3a37; }
    .ref { stroke: #8f8e86; }
    .s1 { fill: #3987e5; }
    .s2 { fill: #d95926; }
    .muted { fill: #45443f; }
    .box { fill: #242422; stroke: #55544e; }
    .line { stroke: #a3a29a; }
    .head { fill: #a3a29a; }
    .oninv { fill: #ffffff; }
  }
</style>
<rect class="bg" x="0.5" y="0.5" width="799" height="399" rx="10"/>
<text x="24" y="34" font-size="16" font-weight="600">Three prompt layouts, three different answers</text>
<text class="sec" x="24" y="54" font-size="12.5">Each strip is one request, read left to right. A cache can only reuse the part before the first change.</text>
<rect class="s1" x="24" y="68" width="12" height="12" rx="2"/><text class="sec" x="42" y="78.5" font-size="12.5">read from cache</text>
<rect class="s2" x="164" y="68" width="12" height="12" rx="2"/><text class="sec" x="182" y="78.5" font-size="12.5">first change</text>
<rect class="muted" x="284" y="68" width="12" height="12" rx="2"/><text class="sec" x="302" y="78.5" font-size="12.5">paid for again</text>
<text x="24" y="112" font-size="13.5" font-weight="600">1  Append-only conversation</text>
<text class="sec" x="24" y="129" font-size="11.5">New turns are added at the end. Automatic caching works.</text>
<rect class="s1" x="24" y="139" width="68" height="30" rx="4"/>
<text class="oninv" x="58.0" y="158.5" font-size="11.5" text-anchor="middle">tools</text>
<rect class="s1" x="94" y="139" width="88" height="30" rx="4"/>
<text class="oninv" x="138.0" y="158.5" font-size="11.5" text-anchor="middle">system</text>
<rect class="s1" x="184" y="139" width="78" height="30" rx="4"/>
<text class="oninv" x="223.0" y="158.5" font-size="11.5" text-anchor="middle">turn 1</text>
<rect class="s1" x="264" y="139" width="78" height="30" rx="4"/>
<text class="oninv" x="303.0" y="158.5" font-size="11.5" text-anchor="middle">turn 2</text>
<rect class="s1" x="344" y="139" width="78" height="30" rx="4"/>
<text class="oninv" x="383.0" y="158.5" font-size="11.5" text-anchor="middle">turn 3</text>
<rect class="s2" x="424" y="139" width="88" height="30" rx="4"/>
<text class="oninv" x="468.0" y="158.5" font-size="11.5" text-anchor="middle">new turn</text>
<text x="776" y="112" font-size="12.5" font-weight="600" text-anchor="end">Claude Code: 27%</text>
<text x="24" y="208" font-size="13.5" font-weight="600">2  Content inserted mid-prompt</text>
<text class="sec" x="24" y="225" font-size="11.5">Finished turns go in before the file contents. Needs breakpoints in the right places.</text>
<rect class="s1" x="24" y="235" width="88" height="30" rx="4"/>
<text class="oninv" x="68.0" y="254.5" font-size="11.5" text-anchor="middle">system</text>
<rect class="s1" x="114" y="235" width="88" height="30" rx="4"/>
<text class="oninv" x="158.0" y="254.5" font-size="11.5" text-anchor="middle">examples</text>
<rect class="s1" x="204" y="235" width="88" height="30" rx="4"/>
<text class="oninv" x="248.0" y="254.5" font-size="11.5" text-anchor="middle">repo map</text>
<rect class="s2" x="294" y="235" width="108" height="30" rx="4"/>
<text class="oninv" x="348.0" y="254.5" font-size="11.5" text-anchor="middle">inserted turn</text>
<rect class="muted" x="404" y="235" width="118" height="30" rx="4"/>
<text x="463.0" y="254.5" font-size="11.5" text-anchor="middle">file contents</text>
<rect class="muted" x="524" y="235" width="88" height="30" rx="4"/>
<text x="568.0" y="254.5" font-size="11.5" text-anchor="middle">question</text>
<text x="776" y="208" font-size="12.5" font-weight="600" text-anchor="end">Aider: 125% automatic, 66% planned</text>
<text x="24" y="304" font-size="13.5" font-weight="600">3  Changing value at the top</text>
<text class="sec" x="24" y="321" font-size="11.5">A timestamp in the system prompt. Nothing is reusable until it moves.</text>
<rect class="s2" x="24" y="331" width="118" height="30" rx="4"/>
<text class="oninv" x="83.0" y="350.5" font-size="11.5" text-anchor="middle">system + time</text>
<rect class="muted" x="144" y="331" width="88" height="30" rx="4"/>
<text x="188.0" y="350.5" font-size="11.5" text-anchor="middle">turn 1</text>
<rect class="muted" x="234" y="331" width="88" height="30" rx="4"/>
<text x="278.0" y="350.5" font-size="11.5" text-anchor="middle">turn 2</text>
<rect class="muted" x="324" y="331" width="108" height="30" rx="4"/>
<text x="378.0" y="350.5" font-size="11.5" text-anchor="middle">tool result</text>
<rect class="muted" x="434" y="331" width="88" height="30" rx="4"/>
<text x="478.0" y="350.5" font-size="11.5" text-anchor="middle">turn 3</text>
<rect class="muted" x="524" y="331" width="88" height="30" rx="4"/>
<text x="568.0" y="350.5" font-size="11.5" text-anchor="middle">question</text>
<text x="776" y="304" font-size="12.5" font-weight="600" text-anchor="end">LangGraph template: 125% automatic, 51% fixed</text>
</svg>
